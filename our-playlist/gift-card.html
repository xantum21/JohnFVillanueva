<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Playlist Gift Card Preview</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6e4e9;color:#3d2430;font-family:Georgia,serif}.card{width:3.5in;height:5in;box-sizing:border-box;padding:.38in;text-align:center;background:#fffaf8;border:1px solid #eed3db;border-radius:24px;box-shadow:0 24px 60px #8f536333;display:flex;flex-direction:column;align-items:center;justify-content:center}.eyebrow{font:700 10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a83351}.heart{font-size:36px;color:#d94f70;margin:8px}.card h1{font-size:29px;line-height:1.05;margin:4px 0 12px}.card p{font-size:14px;color:#805f6c;margin:0 0 14px}.qr{width:1.55in;height:1.55in;padding:8px;background:#fff;border:1px solid #efdce2;border-radius:16px}.scan{margin-top:10px;font:700 12px Arial,sans-serif;color:#a83351}.url{margin-top:7px!important;font:10px Arial,sans-serif!important;color:#9a7a84!important}.print{position:fixed;right:18px;top:18px;border:0;border-radius:999px;padding:10px 15px;background:#d94f70;color:white;font-weight:700;cursor:pointer}@media print{body{background:white}.card{box-shadow:none}.print{display:none}}</style></head><body><button class="print" onclick="window.print()">Print</button><main class="card"><div class="eyebrow">A little something for you</div><div class="heart">♡</div><h1>I made you a playlist.</h1><p>There’s a little story hiding inside.</p><img class="qr" src="qr-our-playlist.png" alt="QR code for the playlist"><div class="scan">SCAN ME ♡</div><p class="url">johnfvillanueva.com/our-playlist/</p></main></body></html>
