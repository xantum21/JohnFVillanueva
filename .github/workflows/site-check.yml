name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate site structure and metadata
        run: python3 check-site.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check Python syntax
        run: python3 -m py_compile build-public-resume.py check-site.py fill-placeholders.py

      - name: Verify GitHub Pages root files
        run: |
          test -f .nojekyll
          test "$(tr -d '\r\n' < CNAME)" = "johnfvillanueva.com"
