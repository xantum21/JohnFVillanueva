  <meta name="description" content="Practice recognizing Japanese hiragana and katakana from romaji in this browser-based learning game.">
<title>Romaji to Kana Game</title>
<style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(231, 91, 131, 0.34), transparent 36%),
        radial-gradient(circle at 85% 18%, rgba(88, 160, 220, 0.3), transparent 38%),

      color: #fff;
    }
    h1, h2 {
      color: #fff;
      text-shadow: 2px 2px 4px #000;
    }
    #question {
      font-size: 2em;
      margin: 20px;
      text-shadow: 2px 2px 4px #000;
    }
    .feedback {
      font-size: 1.5em;
      font-weight: bold;
      text-shadow: 1px 1px 3px #000;
    }
    .correct {
      color: #00ff00;
    }
    .wrong {
      color: #ff3333;
    }
    .streak {
      font-size: 1.2em;
      margin-top: 10px;
    }
    .streak.green {
      color: #00ff00;
    }
    .streak.red {
      color: #ff3333;
    }
    #musicPrompt {
      color: white;
      font-size: 1em;
      margin-top: 20px;
      text-shadow: 1px 1px 2px #000;
    }
    input[type="text"] {
      font-size: 1.5em;
      width: 80px;
      text-align: center;
      padding: 8px;
      border: 2px solid rgba(255,255,255,.5);
      border-radius: 10px;
    }
    button {
      font-size: 1em;
      padding: 10px 20px;
      margin-top: 10px;
    }
    #leaderboard, #gameSection {
      display: none;
      width: min(680px, 100%);
      margin: 60px auto 0;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 20px;
      background: rgba(8, 13, 30, .72);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }
    #leaderboardTable {
      background-color: rgba(0, 0, 0, 0.7);
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
    }
    table {
      margin: auto;
      width: 80%;
      color: white;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }
    #leaderboardBtn {
      position: absolute;
      top: 20px;
      left: 20px;
    }
    #returnBtn {
      position: absolute;
      top: 20px;
      right: 20px;
    }
    #resetBtnBottom {
      margin-top: 30px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #soundToggle { margin-left: 8px; }
    @media (max-width: 640px) {
      body { padding: 68px 14px 90px; }
      #leaderboardBtn { top: 12px; left: 12px; }
      #gameSection, #leaderboard { margin-top: 28px; padding: 22px 16px; }
      table { width: 100%; }
    }
  </style>

<body><nav aria-label="Interactive media navigation" class="jv-play-nav"><a href="/play/">← Play Hub</a><a class="secondary" href="/projects.html">Portfolio Projects</a></nav>
<button id="leaderboardBtn" onclick="showLeaderboard()" type="button">Leaderboard</button>
<!-- GAME SECTION -->
<section aria-labelledby="game-title" id="gameSection">
<h1 id="game-title">Romaji to Kana Quiz</h1>
<div aria-live="polite" id="question">Loading...</div>
<label class="sr-only" for="answerInput">Enter the matching kana character</label>
<input aria-describedby="answer-help" autocomplete="off" autocapitalize="none" id="answerInput" spellcheck="false" type="text"/>
<button onclick="checkAnswer()" type="button">Submit answer</button>
<button aria-pressed="true" id="soundToggle" type="button">Sound: On</button>
<p id="answer-help">Type the matching hiragana or katakana character.</p>
<div aria-live="polite" class="feedback" id="feedback" role="status"></div>
<div class="streak green" id="streakDisplay">Streak: 0</div>
</section>
<!-- LEADERBOARD SECTION -->
<section aria-labelledby="leaderboard-title" id="leaderboard">
<h2 id="leaderboard-title">Recent Leaderboard</h2>
<div id="leaderboardTable">
<table>
<caption class="sr-only">The ten most recent streaks saved in this browser</caption>
<thead>
<tr><th>Name</th><th>Score</th></tr>
</thead>
<tbody id="leaderboardBody"></tbody>
</table>
</div>
<button id="returnBtn" onclick="showGame()" type="button">Return to Game</button>
<button id="resetBtnBottom" onclick="resetLeaderboard()" type="button">Reset Leaderboard</button>
<p>Scores are stored only in this browser under the name “Local player.”</p>
</section>
<script>
    const quizData = [
      // HIRAGANA
      { romaji: "a", kana: "あ", type: "hiragana" }, { romaji: "i", kana: "い", type: "hiragana" },
      { romaji: "u", kana: "う", type: "hiragana" }, { romaji: "e", kana: "え", type: "hiragana" },
      { romaji: "o", kana: "お", type: "hiragana" }, { romaji: "ka", kana: "か", type: "hiragana" },
      { romaji: "ki", kana: "き", type: "hiragana" }, { romaji: "ku", kana: "く", type: "hiragana" },
      { romaji: "ke", kana: "け", type: "hiragana" }, { romaji: "ko", kana: "こ", type: "hiragana" },
      { romaji: "sa", kana: "さ", type: "hiragana" }, { romaji: "shi", kana: "し", type: "hiragana" },
      { romaji: "su", kana: "す", type: "hiragana" }, { romaji: "se", kana: "せ", type: "hiragana" },
      { romaji: "so", kana: "そ", type: "hiragana" }, { romaji: "ta", kana: "た", type: "hiragana" },
      { romaji: "chi", kana: "ち", type: "hiragana" }, { romaji: "tsu", kana: "つ", type: "hiragana" },
      { romaji: "te", kana: "て", type: "hiragana" }, { romaji: "to", kana: "と", type: "hiragana" },
      { romaji: "na", kana: "な", type: "hiragana" }, { romaji: "ni", kana: "に", type: "hiragana" },
      { romaji: "nu", kana: "ぬ", type: "hiragana" }, { romaji: "ne", kana: "ね", type: "hiragana" },
      { romaji: "no", kana: "の", type: "hiragana" }, { romaji: "ha", kana: "は", type: "hiragana" },
      { romaji: "hi", kana: "ひ", type: "hiragana" }, { romaji: "fu", kana: "ふ", type: "hiragana" },
      { romaji: "he", kana: "へ", type: "hiragana" }, { romaji: "ho", kana: "ほ", type: "hiragana" },
      { romaji: "ma", kana: "ま", type: "hiragana" }, { romaji: "mi", kana: "み", type: "hiragana" },
      { romaji: "mu", kana: "む", type: "hiragana" }, { romaji: "me", kana: "め", type: "hiragana" },
      { romaji: "mo", kana: "も", type: "hiragana" }, { romaji: "ya", kana: "や", type: "hiragana" },
      { romaji: "yu", kana: "ゆ", type: "hiragana" }, { romaji: "yo", kana: "よ", type: "hiragana" },
      { romaji: "ra", kana: "ら", type: "hiragana" }, { romaji: "ri", kana: "り", type: "hiragana" },
      { romaji: "ru", kana: "る", type: "hiragana" }, { romaji: "re", kana: "れ", type: "hiragana" },
      { romaji: "ro", kana: "ろ", type: "hiragana" }, { romaji: "wa", kana: "わ", type: "hiragana" },
      { romaji: "wo", kana: "を", type: "hiragana" }, { romaji: "n", kana: "ん", type: "hiragana" },

      // KATAKANA
      { romaji: "a", kana: "ア", type: "katakana" }, { romaji: "i", kana: "イ", type: "katakana" },
      { romaji: "u", kana: "ウ", type: "katakana" }, { romaji: "e", kana: "エ", type: "katakana" },
      { romaji: "o", kana: "オ", type: "katakana" }, { romaji: "ka", kana: "カ", type: "katakana" },
      { romaji: "ki", kana: "キ", type: "katakana" }, { romaji: "ku", kana: "ク", type: "katakana" },
      { romaji: "ke", kana: "ケ", type: "katakana" }, { romaji: "ko", kana: "コ", type: "katakana" },
      { romaji: "sa", kana: "サ", type: "katakana" }, { romaji: "shi", kana: "シ", type: "katakana" },
      { romaji: "su", kana: "ス", type: "katakana" }, { romaji: "se", kana: "セ", type: "katakana" },
      { romaji: "so", kana: "ソ", type: "katakana" }, { romaji: "ta", kana: "タ", type: "katakana" },
      { romaji: "chi", kana: "チ", type: "katakana" }, { romaji: "tsu", kana: "ツ", type: "katakana" },
      { romaji: "te", kana: "テ", type: "katakana" }, { romaji: "to", kana: "ト", type: "katakana" },
      { romaji: "na", kana: "ナ", type: "katakana" }, { romaji: "ni", kana: "ニ", type: "katakana" },
      { romaji: "nu", kana: "ヌ", type: "katakana" }, { romaji: "ne", kana: "ネ", type: "katakana" },
      { romaji: "no", kana: "ノ", type: "katakana" }, { romaji: "ha", kana: "ハ", type: "katakana" },
      { romaji: "hi", kana: "ヒ", type: "katakana" }, { romaji: "fu", kana: "フ", type: "katakana" },
      { romaji: "he", kana: "ヘ", type: "katakana" }, { romaji: "ho", kana: "ホ", type: "katakana" },
      { romaji: "ma", kana: "マ", type: "katakana" }, { romaji: "mi", kana: "ミ", type: "katakana" },
      { romaji: "mu", kana: "ム", type: "katakana" }, { romaji: "me", kana: "メ", type: "katakana" },
      { romaji: "mo", kana: "モ", type: "katakana" }, { romaji: "ya", kana: "ヤ", type: "katakana" },
      { romaji: "yu", kana: "ユ", type: "katakana" }, { romaji: "yo", kana: "ヨ", type: "katakana" },
      { romaji: "ra", kana: "ラ", type: "katakana" }, { romaji: "ri", kana: "リ", type: "katakana" },
      { romaji: "ru", kana: "ル", type: "katakana" }, { romaji: "re", kana: "レ", type: "katakana" },
      { romaji: "ro", kana: "ロ", type: "katakana" }, { romaji: "wa", kana: "ワ", type: "katakana" },
      { romaji: "wo", kana: "ヲ", type: "katakana" }, { romaji: "n", kana: "ン", type: "katakana" }
    ];

    let currentQuestion;
    let streak = 0;
    let soundEnabled = true;
    let audioContext;

    function playTone(frequency, duration = 0.12) {
      if (!soundEnabled) return;
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.07, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playFeedback(correct) {
      playTone(correct ? 660 : 190, correct ? 0.16 : 0.22);
    }

    function readScores() {
      try {
        const scores = JSON.parse(localStorage.getItem("kana_leaderboard") || "[]");
        return Array.isArray(scores) ? scores : [];
      } catch {
        return [];
      }
    }

    function loadQuestion() {
      const randomIndex = Math.floor(Math.random() * quizData.length);
      currentQuestion = quizData[randomIndex];
      document.getElementById("question").textContent = `${currentQuestion.romaji} - ${currentQuestion.type}`;
      document.getElementById("answerInput").value = "";
      document.getElementById("feedback").textContent = "";
      document.getElementById("answerInput").focus({ preventScroll: true });
    }

    function checkAnswer() {
      const userAnswer = document.getElementById("answerInput").value.trim();
      const feedback = document.getElementById("feedback");
      const streakDisplay = document.getElementById("streakDisplay");

      if (!userAnswer) {
        feedback.textContent = "Enter a kana character first.";
        return;
      }

      const isCorrect = userAnswer === currentQuestion.kana;

      if (isCorrect) {
        feedback.textContent = "Correct!";
        feedback.className = "feedback correct";
        playFeedback(true);
        streak++;
        streakDisplay.className = "streak green";
      } else {
        feedback.textContent = "Wrong";
        feedback.className = "feedback wrong";
        playFeedback(false);
        streakDisplay.className = "streak red";
        if (streak > 0) recordStreak();
        streak = 0;
      }

      streakDisplay.textContent = `Streak: ${streak}`;
      setTimeout(loadQuestion, 1000);
    }

    function recordStreak() {
      const leaderboard = readScores();
      leaderboard.push({ name: "Local player", score: streak });
      localStorage.setItem("kana_leaderboard", JSON.stringify(leaderboard));
    }

    function showGame() {
      document.getElementById("gameSection").style.display = "block";
      document.getElementById("leaderboard").style.display = "none";
      loadQuestion();
    }

    function showLeaderboard() {
      const table = document.getElementById("leaderboardBody");
      table.innerHTML = "";
      const scores = readScores();
      scores.slice(-10).reverse().forEach(entry => {
        const row = document.createElement("tr");
        const name = document.createElement("td");
        const score = document.createElement("td");
        name.textContent = String(entry.name || "").slice(0, 40);
        score.textContent = String(Number(entry.score) || 0);
        row.append(name, score);
        table.append(row);
      });
      document.getElementById("gameSection").style.display = "none";
      document.getElementById("leaderboard").style.display = "block";
    }

    function resetLeaderboard() {
      localStorage.removeItem("kana_leaderboard");
      showLeaderboard();
    }

    document.getElementById("soundToggle").addEventListener("click", function () {
      soundEnabled = !soundEnabled;
      this.setAttribute("aria-pressed", String(soundEnabled));
      this.textContent = soundEnabled ? "Sound: On" : "Sound: Off";
    });

    document.getElementById("answerInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") checkAnswer();
    });

    window.onload = showGame;
  </script>
</body>
</html>
